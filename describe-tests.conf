# This file documents each test to help viewers.

[100G-speed]

Downloads a single 100 gigabyte file over clear-text HTTP/1.1 from an Apache
httpd server running on localhost with the curl tool. The measured network
transfer speed is what the curl tool itself reports.

[single-numallocs]

Downloads a single 512K file over clear-text HTTP/1.1 from an Apache httpd
server running on localhost. Using the build-in memory-tracking, all
allocations done by curl and libcurl are logged and then counted.

[single-maxalloc]

Downloads a single 512K file over clear-text HTTP/1.1 from an Apache httpd
server running on localhost. Using the build-in memory-tracking, all
allocations done by curl and libcurl are logged and then added up. This number
is the peak number of bytes allocated concurrently at any point through the
operation.

[h1parallel-speed]

Downloads 100 files each in 100 parallel transfers, each getting a 500MB file.
Using HTTP/1.1 over HTTPS from an Apache httpd running on localhost. This
measures total throughput.

[h2parallel-speed]

Downloads 100 files each in 100 parallel transfers, each getting a 500MB file.
Using HTTP/2 over HTTPS from an Apache httpd running on localhost. This
measures total throughput.

[h3parallel-speed]

Downloads 100 files each in 100 parallel transfers, each getting a 500MB file.
Using HTTP/3 over HTTPS from a Caddy server running on localhost. This
measures total throughput.

[h1parallel-mem]

Downloads 100 files each in 100 parallel transfers, each getting a 500MB file.
Using HTTP/1.1 over HTTPS from an Apache httpd running on localhost. This
measures the maximum RSS size for the process during the transfer.

[h2parallel-mem]

Downloads 100 files each in 100 parallel transfers, each getting a 500MB file.
Using HTTP/2 over HTTPS from an Apache httpd running on localhost. This
measures the maximum RSS size for the process during the transfer.

[h3parallel-mem]

Downloads 100 files each in 100 parallel transfers, each getting a 500MB file.
Using HTTP/3 over HTTPS from a Caddy server running on localhost. This
measures the maximum RSS size for the process during the transfer.

[h1parallel-upload-speed]

Uploads 100 files each in 50 parallel transfers, each uploading a 500MB file.
Using HTTP/1.1 over HTTPS to an Apache httpd running on localhost. This
measures the total throughput.

[h2parallel-upload-speed]

Uploads 100 files each in 50 parallel transfers, each uploading a 500MB file.
Using HTTP/2 over HTTPS to an Apache httpd running on localhost. This measures
the total throughput.

[h3parallel-upload-speed]

Uploads 100 files each in 50 parallel transfers, each uploading a 500MB file.
Using HTTP/3 over HTTPS to an Apache httpd (via a httpx proxy) running on
localhost. This measures the total throughput.

[h1parallel-upload-mem]

Uploads 100 files each in 50 parallel transfers, each uploading a 500MB file.
Using HTTP/1.1 over HTTPS to an Apache httpd running on localhost. This
measures the maximum RSS size for the process during the transfer.

[h2parallel-upload-mem]

Uploads 100 files each in 50 parallel transfers, each uploading a 500MB file.
Using HTTP/2 over HTTPS to an Apache httpd running on localhost. This measures
the maximum RSS size for the process during the transfer.

[h3parallel-upload-mem]

Uploads 100 files each in 50 parallel transfers, each uploading a 500MB file.
Using HTTP/3 over HTTPS to an Apache httpd (via a httpx proxy) running on
localhost. This measures the maximum RSS size for the process during the
transfer.

[h1-requests]

Downloads 100,000 small files (10K) using 40 parallel transfers over HTTP/1.1
HTTPS from an Apache httpd running on localhost. Measures how many such
requests per second it reaches.

[h2-requests]

Downloads 100,000 small files (10K) using 40 parallel transfers over HTTP/2
HTTPS from an Apache httpd running on localhost. Measures how many such
requests per second it reaches.

[h3-requests]

Downloads 100,000 small files (10K) using 40 parallel transfers over HTTP/3
HTTPS from a Caddy server running on localhost. Measures how many such
requests per second it reaches.

[h1-req-mem]

Downloads 100,000 small files (10K) using 40 parallel transfers over HTTP/1.1
HTTPS from an Apache httpd running on localhost. Measures the maximum RSS size
for the process during the transfer.

[h2-req-mem]

Downloads 100,000 small files (10K) using 40 parallel transfers over HTTP/2
HTTPS from an Apache httpd running on localhost. Measures the maximum RSS size
for the process during the transfer.

[h3-req-mem]

Downloads 100,000 small files (10K) using 40 parallel transfers over HTTP/3
HTTPS from a Caddy server running on localhost. Measures the maximum RSS size
for the process during the transfer.